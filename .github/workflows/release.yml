# Build BPE setup-host packages for Linux, Windows, macOS (arm64 + Intel).
# Ships a GUI generate & rebuild host + sources + psxrecomp-game/bios tools —
# not game C, not BIOS backends, not disc images. First-run Generate emits
# OpenBIOS (+ optional SCPH1001) and game C locally, then rebuilds.
#
# No private CI assets. No BIOS dumps. No generated/ required.
#
# Triggers:
#   - workflow_dispatch — prompts for version; optionally tags + publishes
#   - push tags matching v* — builds + publishes that tag

name: Release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2 or v0.1.2)'
        required: true
        type: string
      publish:
        description: 'Create git tag vX.Y.Z and GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: bpe-release-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Normalize version / tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
            PUBLISH="${{ github.event.inputs.publish }}"
          else
            RAW="${{ github.ref_name }}"
            PUBLISH="true"
          fi
          RAW="$(printf '%s' "${RAW}" | tr -d '[:space:]')"
          if [[ -z "${RAW}" ]]; then
            echo "::error::version is empty"
            exit 1
          fi
          VER="${RAW#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
            echo "::error::invalid version '${RAW}' (want X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          TAG="v${VER}"
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >>"$GITHUB_OUTPUT"
          echo "Using version ${VER} (tag ${TAG}), publish=${PUBLISH}"

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            shell: bash
          - os: windows-2022
            artifact: windows-x64
            shell: 'msys2 {0}'
          - os: macos-15
            artifact: macos-arm64
            shell: bash
            deployment_target: '11.0'
          - os: macos-15-intel
            artifact: macos-x64
            shell: bash
            deployment_target: '11.0'

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      BPE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin VERSION for this release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${BPE_RELEASE_VERSION}" >VERSION
          echo "VERSION=$(cat VERSION)"

      - name: Record pinned framework revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "psxrecomp=$(git -C psxrecomp rev-parse --short HEAD) ($(git -C psxrecomp rev-parse HEAD))"
          echo "recomp-ui=$(git -C recomp-ui rev-parse --short HEAD)"
          echo "recomp-net=$(git -C psxrecomp/lib/recomp-net rev-parse --short HEAD)"

      - name: Setup host mode (no game C, no BIOS backends)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated psxrecomp/generated
          echo "Cleared any generated/ trees — CI builds a BIOS-free setup host."

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            zip

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config sdl3 || brew install cmake ninja pkg-config sdl2

      - name: Build recompiler tools (game + bios emitters)
        run: |
          set -euo pipefail
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          if [[ -d /mingw64/bin ]]; then
            export PATH="/mingw64/bin:${PATH}"
          fi
          cmake -S psxrecomp/recompiler -B build-recompiler -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-recompiler \
            --target psxrecomp-game psxrecomp-bios -j"${JOBS}"
          for bin in psxrecomp-bios psxrecomp-game; do
            if [[ -f "build-recompiler/${bin}.exe" ]]; then
              chmod +x "build-recompiler/${bin}.exe"
            elif [[ -f "build-recompiler/${bin}" ]]; then
              chmod +x "build-recompiler/${bin}"
            else
              echo "::error::${bin} missing after recompiler build"
              exit 1
            fi
          done

      - name: Configure & build setup host (no game C, no BIOS backends)
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ -n "${CMAKE_OSX_DEPLOYMENT_TARGET:-}" ]]; then
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET}")
          fi
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPE_FORCE_SETUP_HOST=ON \
            -DPSXRECOMP_ALLOW_NO_BIOS=ON \
            -DPSX_GAME_VERSION="${BPE_RELEASE_VERSION}" \
            "${EXTRA[@]}"
          cmake --build build-ci --target psx-runtime -j"${JOBS}"

      - name: Package setup zip + tools pack
        run: |
          set -euo pipefail
          chmod +x scripts/package_setup_release.sh
          chmod +x scripts/package_psxrecomp_tools.sh
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export BPE_RUNTIME_BIN_DIR=/mingw64/bin
          fi
          export BPE_RELEASE_VERSION
          # Overlay SDK + both emitters *before* the game zip so one bpe-*.zip
          # is wizard-complete (same artifact RetComM uses for install/update).
          cp -a psxrecomp-sdk/. psxrecomp/
          mkdir -p psxrecomp/recompiler/build
          for cand in \
              build-recompiler/psxrecomp-game \
              build-recompiler/psxrecomp-game.exe \
              build-recompiler/psxrecomp-bios \
              build-recompiler/psxrecomp-bios.exe; do
            if [[ -f "$cand" ]]; then
              cp -a "$cand" "psxrecomp/recompiler/build/$(basename "$cand")"
            fi
          done
          scripts/package_setup_release.sh build-ci "${{ matrix.artifact }}" build-recompiler
          # Optional slim tools zip (shared-cache fallback); game zip is enough.
          scripts/package_psxrecomp_tools.sh psxrecomp "${{ matrix.artifact }}" dist
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpe-${{ matrix.artifact }}
          path: |
            dist/bpe-*-${{ matrix.artifact }}.zip
            dist/psxrecomp-tools-${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for tagging on workflow_dispatch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten zips
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'bpe-*.zip' -o -name 'psxrecomp-tools-*.zip' \) \
            -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally"
          else
            git tag -a "${TAG}" -m "Bomberman Party Edition ${TAG}"
          fi
          # Push tag if missing on remote (idempotent).
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on origin"
          else
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Bomberman Party Edition ${{ needs.prepare.outputs.tag }}
          files: |
            dist/bpe-*.zip
            dist/psxrecomp-tools-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
