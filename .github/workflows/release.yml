# Build BPE setup-host packages for Linux, Windows, macOS (arm64 + Intel).
# Ships a GUI generate & rebuild host + sources + psxrecomp-game — not game C,
# BIOS, or disc images. Users supply a legal disc; first-run builds playable
# binary locally (see psxrecomp/docs/LOCAL_CODEGEN_SDK.md).
#
# Requires:
#   - Secret CI_ASSETS_TOKEN: fine-grained PAT with Contents:Read on
#     TechnicallyComputers/psxrecomp-ci-assets (private). That repo supplies
#     SCPH1001.BIN (Git LFS) for BIOS regen on the runner (OpenBIOS + retail
#     link-time BIOS C). Players still pick BIOS + disc at first launch.
#
# Framework deps use this repository's exact gitlink pins:
#   - psxrecomp at the game root (which owns its recomp-net pin)
#   - recomp-ui at the game root
#
# PGO is local-only. CI builds plain Release — do not set PSX_PGO here.
# Toolchains are NOT embedded — RetComM fetches cmake-clang-v1 from
# TechnicallyComputers/retcomm-toolchains on demand.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - push tags matching v* (publishes a GitHub Release)

name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: bpe-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            shell: bash
          - os: windows-2022
            artifact: windows-x64
            shell: 'msys2 {0}'
          - os: macos-15
            artifact: macos-arm64
            shell: bash
            deployment_target: '11.0'
          - os: macos-15-intel
            artifact: macos-x64
            shell: bash
            deployment_target: '11.0'

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record pinned framework revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "psxrecomp=$(git -C psxrecomp rev-parse --short HEAD) ($(git -C psxrecomp rev-parse HEAD))"
          echo "recomp-ui=$(git -C recomp-ui rev-parse --short HEAD)"
          echo "recomp-net=$(git -C psxrecomp/lib/recomp-net rev-parse --short HEAD)"

      # Windows runners ship Git LFS; install only where apt/brew is needed.
      # Use bash (not MSYS2) so this runs before setup-msys2.
      - name: Install git-lfs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install

      - name: Install git-lfs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install git-lfs
          git lfs install

      - name: Fetch CI assets (private, LFS)
        uses: actions/checkout@v4
        with:
          repository: TechnicallyComputers/psxrecomp-ci-assets
          token: ${{ secrets.CI_ASSETS_TOKEN }}
          path: _ci-assets
          fetch-depth: 1
          lfs: true

      - name: Setup host mode (no game generated C required)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f generated/SLUS_011.89_dispatch.c ]]; then
            echo "Note: generated/ is present; CI still builds a setup zip."
            echo "Force setup-only link with -DBPE_FORCE_SETUP_HOST=ON."
          else
            echo "generated/ absent — configuring setup host (expected)."
          fi

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            zip

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libsdl2-dev: still useful for headers/tooling; runtime defaults to
          # SDL3 via FetchContent. libxtst-dev is required when building the
          # fetched SDL3 (SDL_X11_XTEST); libsdl2-dev does not pull it in.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # Prefer system SDL3 when available; FetchContent covers older brew.
          brew install cmake ninja pkg-config sdl3 || brew install cmake ninja pkg-config sdl2
          # zip is preinstalled; llvm-profdata via xcrun / Xcode CLT

      # Current psxrecomp requires <stem>_psx_bios_backend in generated dispatch.
      # The SCPH1001.zip in ci-assets is pre-descriptor; regenerate on the runner.
      # Use matrix shell (msys2 on Windows) — Git Bash cannot load MinGW DLLs for
      # psxrecomp-bios.exe (exit 127 right after "emit-full").
      - name: Regenerate BIOS C (OpenBIOS + SCPH1001)
        run: |
          set -euo pipefail
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          # MinGW runtime DLLs for the just-built psxrecomp-bios[.exe]
          if [[ -d /mingw64/bin ]]; then
            export PATH="/mingw64/bin:${PATH}"
          fi

          BIOS_SRC=''
          for cand in \
              '_ci-assets/SCPH1001.BIN' \
              '_ci-assets/SCPH1001.bin' \
              '_ci-assets/bios/SCPH1001.BIN' \
              '_ci-assets/bios/SCPH1001.bin'; do
            if [[ -f "$cand" ]]; then BIOS_SRC="$cand"; break; fi
          done
          if [[ -z "${BIOS_SRC}" ]]; then
            echo "::error::SCPH1001.BIN missing under _ci-assets (need dump for retail BIOS regen)"
            find _ci-assets -maxdepth 2 -type f | head -40
            exit 1
          fi
          BIOS_SZ="$(wc -c < "${BIOS_SRC}" | tr -d '[:space:]')"
          if [[ "${BIOS_SZ}" -lt 500000 || "${BIOS_SZ}" -gt 600000 ]]; then
            echo "::error::BIOS size ${BIOS_SZ} looks wrong (want ~512 KiB)"
            exit 1
          fi
          mkdir -p psxrecomp/bios
          cp -f "${BIOS_SRC}" psxrecomp/bios/SCPH1001.BIN

          cmake -S psxrecomp/recompiler -B build-recompiler -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-recompiler \
            --target psxrecomp-bios psxrecomp-game -j"${JOBS}"

          # MSYS sees PE files without +x; chmod so bash can exec them.
          for bin in psxrecomp-bios psxrecomp-game; do
            if [[ -f "build-recompiler/${bin}.exe" ]]; then
              chmod +x "build-recompiler/${bin}.exe"
            elif [[ -f "build-recompiler/${bin}" ]]; then
              chmod +x "build-recompiler/${bin}"
            fi
          done
          if [[ ! -f build-recompiler/psxrecomp-game && \
                ! -f build-recompiler/psxrecomp-game.exe ]]; then
            echo "::error::psxrecomp-game missing after recompiler build"
            exit 1
          fi

          (
            cd psxrecomp
            export PSXRECOMP_BIOS_BUILD="${PWD}/../build-recompiler"
            bash tools/regen_bios.sh --config bios/OpenBIOS.toml
            bash tools/regen_bios.sh --config bios/SCPH1001.toml
          )

          for stem in OpenBIOS SCPH1001; do
            for f in "psxrecomp/generated/${stem}_full.c" \
                     "psxrecomp/generated/${stem}_dispatch.c"; do
              if [[ ! -f "$f" ]]; then
                echo "::error::missing $f after regen_bios"
                exit 1
              fi
            done
            if ! grep -q "${stem}_psx_bios_backend" \
                "psxrecomp/generated/${stem}_dispatch.c"; then
              echo "::error::${stem}_dispatch.c lacks ${stem}_psx_bios_backend descriptor"
              exit 1
            fi
            echo "BIOS ${stem}: OK ($(wc -c < "psxrecomp/generated/${stem}_full.c") bytes)"
          done

      - name: Configure & build setup host (Release, no game C link)
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXTRA=()
          if [[ -n "${CMAKE_OSX_DEPLOYMENT_TARGET:-}" ]]; then
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET}")
          fi
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          # BPE_FORCE_SETUP_HOST: never link committed generated/ into the CI zip.
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRNET_ENABLE_ICE=ON \
            -DBPE_FORCE_SETUP_HOST=ON \
            -DPSX_GAME_VERSION="${VERSION}" \
            "${EXTRA[@]}"
          cmake --build build-ci --target psx-runtime -j"${JOBS}"

      - name: Package setup zip (sources + tools + host)
        run: |
          set -euo pipefail
          chmod +x scripts/package_setup_release.sh
          chmod +x scripts/package_psxrecomp_tools.sh
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export BPE_RUNTIME_BIN_DIR=/mingw64/bin
          fi
          # Do not embed toolchains — fetch via RetComM / retcomm-toolchains.
          scripts/package_setup_release.sh build-ci "${{ matrix.artifact }}" build-recompiler
          # Overlay vendored SDK surface, then pack cli + psxrecomp-game.
          cp -a psxrecomp-sdk/. psxrecomp/
          mkdir -p psxrecomp/recompiler/build
          for cand in build-recompiler/psxrecomp-game build-recompiler/psxrecomp-game.exe; do
            if [[ -f "$cand" ]]; then
              cp -a "$cand" "psxrecomp/recompiler/build/$(basename "$cand")"
            fi
          done
          scripts/package_psxrecomp_tools.sh psxrecomp "${{ matrix.artifact }}" dist
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpe-${{ matrix.artifact }}
          path: |
            dist/bpe-*-${{ matrix.artifact }}.zip
            dist/psxrecomp-tools-${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten zips
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'bpe-*.zip' -o -name 'psxrecomp-tools-*.zip' \) \
            -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bpe-*.zip
            dist/psxrecomp-tools-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
